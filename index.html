<input type="file" id="romInput" accept=".nes">
<canvas id="screen" width="256" height="240"></canvas>
<script src="jsnes.min.js"></script> <!-- or your own core -->
<script>
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const imageData = ctx.createImageData(256, 240);

  const nes = new jsnes.NES({
    onFrame(frameBuffer) {
      // frameBuffer is usually an array of 256*240*4 RGBA bytes
      imageData.data.set(frameBuffer);
      ctx.putImageData(imageData, 0, 0);
    },
    onAudioSample(left, right) {
      // send to Web Audio API if you want sound
    }
  });

  document.getElementById('romInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const arrayBuffer = await file.arrayBuffer();
    const bytes = new Uint8Array(arrayBuffer);
    // jsnes expects a binary string; other cores may want Uint8Array directly
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    nes.loadROM(binary);

    // Start running frames (e.g., 60fps)
    function loop() {
      nes.frame();
      requestAnimationFrame(loop);
    }
    loop();
  });
</script>
